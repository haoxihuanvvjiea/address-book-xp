<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通讯录</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:900px;margin:30px auto;padding:0 20px}
.item{border:1px solid #ccc;padding:12px;margin:8px 0;border-radius:6px}
.bookmark{background:#fff8cc}
.btns button{margin:3px;padding:4px 8px;cursor:pointer}
input{padding:4px;margin:4px}
</style>
</head>
<body>
<h1>通讯录</h1>
<div>
    <h3>新增联系人</h3>
    <input id="name" placeholder="姓名">
    <div id="methodBox">
        <div class="oneMethod">
            <input class="mtype" placeholder="类型 phone/email">
            <input class="mcont" placeholder="内容">
        </div>
    </div>
    <button onclick="addMethodLine()">+新增一条联系方式</button>
    <button onclick="addContact()">提交联系人</button>
</div>
<hr>
<div>
    <button onclick="exportExcel()">导出Excel</button>
    <input type="file" id="fileIn" accept=".xlsx">
    <button onclick="importExcel()">导入Excel</button>
</div>
<hr>
<div id="list"></div>

<script>
const base = "/api";
// 加载列表
async function loadList(){
    let res = await fetch(base+"/contact");
    let data = await res.json();
    let html = "";
    for(let c of data){
        let star = c.is_bookmark ? "⭐" : "";
        let cls = c.is_bookmark ? "item bookmark" : "item";
        let mhtml = "";
        for(let m of c.methods){
            mhtml += `<div>${m.type}：${m.content} <button onclick="delMethod(${m.id})">删除该联系方式</button></div>`
        }
        html += `
        <div class="${cls}">
            <b>${star} ${c.name}</b>
            <div>${mhtml}</div>
            <div class="btns">
                <button onclick="toggleStar(${c.id},${c.is_bookmark})">切换收藏</button>
                <button onclick="delContact(${c.id})">删除联系人</button>
            </div>
        </div>
        `
    }
    document.getElementById("list").innerHTML = html;
}

// 增加联系方式输入行
function addMethodLine(){
    const box = document.getElementById("methodBox");
    const div = document.createElement("div");
    div.className="oneMethod";
    div.innerHTML = `<input class="mtype" placeholder="类型 phone/email">
    <input class="mcont" placeholder="内容">`
    box.appendChild(div);
}

// 添加联系人
async function addContact(){
    let name = document.getElementById("name").value.trim();
    if(!name) return alert("填名字");
    let r1 = await fetch(base+"/contact?name="+encodeURIComponent(name),{method:"POST"});
    let c = await r1.json();
    let mtypes = document.querySelectorAll(".mtype");
    let mconts = document.querySelectorAll(".mcont");
    for(let i=0;i<mtypes.length;i++){
        let t = mtypes[i].value.trim();
        let cnt = mconts[i].value.trim();
        if(t && cnt){
            await fetch(base+`/contact/${c.id}/method?method_type=${encodeURIComponent(t)}&content=${encodeURIComponent(cnt)}`,{method:"POST"})
        }
    }
    document.getElementById("name").value="";
    document.getElementById("methodBox").innerHTML = `<div class="oneMethod"><input class="mtype" placeholder="类型 phone/email"><input class="mcont" placeholder="内容"></div>`
    loadList();
}
async function toggleStar(id){
    await fetch(base+`/contact/${id}/bookmark`,{method:"PUT"})
    loadList();
}
async function delContact(id){
    await fetch(base+`/contact/${id}`,{method:"DELETE"})
    loadList();
}
async function delMethod(mid){
    await fetch(base+`/method/${mid}`,{method:"DELETE"})
    loadList();
}
async function exportExcel(){
    window.open(base+"/excel/export")
}
async function importExcel(){
    const f = document.getElementById("fileIn").files[0];
    if(!f) return alert("先选文件");
    let fd = new FormData();
    fd.append("file",f);
    await fetch(base+"/excel/import",{method:"POST",body:fd})
    loadList();
    alert("导入完成");
}
loadList();
</script>
</body>
</html>
